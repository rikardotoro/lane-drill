[project]
name = "lane-drill"
version = "0.1.0"
description = "Your building has fire drills. Your supply chain doesn't."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "rich>=13.7", "pandas>=2.2", "numpy>=1.26"]

[project.scripts]
lane-drill = "lane_drill.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lane_drill"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
